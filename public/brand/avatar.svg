<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none" width="320" height="320">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseRing {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.03); opacity: 1; }
    }
    @keyframes floatCode {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes beaconBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .animated-ring {
      transform-origin: 160px 160px;
      animation: pulseRing 4s ease-in-out infinite;
    }
    .code-symbol {
      animation: floatCode 3s ease-in-out infinite;
    }
    .status-dot {
      animation: beaconBlink 2.5s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .animated-ring, .code-symbol, .status-dot {
        animation: none !important;
      }
    }
  </style>

  <!-- Ambient Glow Backplate -->
  <circle cx="160" cy="160" r="145" fill="#1D4ED8" opacity="0.15" filter="url(#softGlow)" />

  <!-- Outer Pulsing Decorative Ring -->
  <circle class="animated-ring" cx="160" cy="160" r="142" stroke="url(#ringGrad)" stroke-width="3" stroke-dasharray="12 6" opacity="0.85" />

  <!-- Avatar Base Circle -->
  <clipPath id="avatarClip">
    <circle cx="160" cy="160" r="132" />
  </clipPath>

  <g clip-path="url(#avatarClip)">
    <!-- Tech Background -->
    <rect width="320" height="320" fill="url(#bgGrad)" />
    
    <!-- Code Accent Watermarks -->
    <text x="35" y="90" font-family="monospace" font-size="18" font-weight="700" fill="#38BDF8" opacity="0.25" class="code-symbol">&lt;/&gt;</text>
    <text x="250" y="110" font-family="monospace" font-size="20" font-weight="700" fill="#F59E0B" opacity="0.25" class="code-symbol">{ }</text>
    <text x="40" y="240" font-family="monospace" font-size="14" font-weight="600" fill="#94A3B8" opacity="0.2">const Daniel = dev =&gt;</text>
    
    <!-- Developer Portrait Illustration -->
    <!-- Shoulders / Tech Hoodie -->
    <path d="M70 320 C70 250, 110 230, 160 230 C210 230, 250 250, 250 320 Z" fill="#1E293B" />
    <path d="M125 240 L160 280 L195 240 Z" fill="#0F172A" />
    <path d="M145 255 L160 275 L175 255 Z" fill="#2563EB" />

    <!-- Neck -->
    <rect x="142" y="195" width="36" height="45" rx="6" fill="#D97706" opacity="0.8" />
    
    <!-- Head / Face -->
    <ellipse cx="160" cy="155" rx="46" ry="54" fill="#B45309" />
    <ellipse cx="160" cy="155" rx="43" ry="50" fill="#D97706" />

    <!-- Hair (Clean Modern Fade / Cut) -->
    <path d="M114 145 C114 100, 140 92, 160 92 C180 92, 206 100, 206 145 C195 125, 175 118, 160 118 C145 118, 125 125, 114 145 Z" fill="#090D16" />
    
    <!-- Ears -->
    <ellipse cx="115" cy="160" rx="7" ry="11" fill="#B45309" />
    <ellipse cx="205" cy="160" rx="7" ry="11" fill="#B45309" />

    <!-- Smart Glasses Frame -->
    <!-- Left Rim -->
    <rect x="127" y="142" width="28" height="22" rx="6" fill="none" stroke="#0F172A" stroke-width="4" />
    <rect x="129" y="144" width="24" height="18" rx="4" fill="#38BDF8" opacity="0.2" />
    <!-- Bridge -->
    <path d="M155 152 H165" stroke="#0F172A" stroke-width="4" stroke-linecap="round" />
    <!-- Right Rim -->
    <rect x="165" y="142" width="28" height="22" rx="6" fill="none" stroke="#0F172A" stroke-width="4" />
    <rect x="167" y="144" width="24" height="18" rx="4" fill="#38BDF8" opacity="0.2" />

    <!-- Focused Eyes -->
    <ellipse cx="141" cy="153" rx="3.5" ry="3.5" fill="#0F172A" />
    <circle cx="142" cy="151.5" r="1.2" fill="#FFFFFF" />
    <ellipse cx="179" cy="153" rx="3.5" ry="3.5" fill="#0F172A" />
    <circle cx="180" cy="151.5" r="1.2" fill="#FFFFFF" />

    <!-- Eyebrows -->
    <path d="M128 136 C134 133, 148 134, 153 138" stroke="#090D16" stroke-width="3" stroke-linecap="round" />
    <path d="M192 136 C186 133, 172 134, 167 138" stroke="#090D16" stroke-width="3" stroke-linecap="round" />

    <!-- Clean Beard / Jawline Shadow -->
    <path d="M138 185 C145 194, 175 194, 182 185 C178 198, 142 198, 138 185 Z" fill="#090D16" opacity="0.75" />
    <!-- Smile / Confidence -->
    <path d="M149 177 C155 182, 165 182, 171 177" stroke="#090D16" stroke-width="2.5" stroke-linecap="round" />

    <!-- Modern Minimal Over-ear Headset / Audio detail -->
    <path d="M109 146 C109 135, 115 130, 115 170 C115 180, 109 175, 109 146 Z" fill="#2563EB" />
    <path d="M211 146 C211 135, 205 130, 205 170 C205 180, 211 175, 211 146 Z" fill="#2563EB" />
  </g>

  <!-- Live Status Badge (Available for Business / Projects) -->
  <g transform="translate(205, 240)">
    <rect width="90" height="28" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
    <circle class="status-dot" cx="16" cy="14" r="5" fill="#10B981" />
    <text x="28" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">ACTIVE</text>
  </g>
</svg>